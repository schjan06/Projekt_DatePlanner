  <path d="M1105 214 V268 H682" stroke="#6d4cff" stroke-width="3" fill="none" marker-end="url(#arrow-creator)"/>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="380" y="252" width="286" height="88" rx="18" fill="#ffffff" stroke="#e7ddff" filter="url(#shadow-creator)"/>
    <text x="408" y="284" fill="#241f33" font-size="15" font-weight="800">6 Sichtbarkeit prüfen</text>
    <text x="408" y="310" fill="#6f6a80" font-size="14">Home und Kategorien öffnen,</text>
    <text x="408" y="330" fill="#6f6a80" font-size="14">Filterbarkeit kontrollieren</text>
    <rect x="40" y="265" width="285" height="64" rx="16" fill="#ffffff" stroke="#d8cdf4" stroke-dasharray="8 6"/>
    <text x="62" y="293" fill="#4b2fd6" font-size="14" font-weight="800">Gap</text>
    <text x="62" y="315" fill="#6f6a80" font-size="14">eigene Aktivitäten bearbeiten/löschen</text>
  </g>
