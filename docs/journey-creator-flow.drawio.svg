<svg host="app.diagrams.net" xmlns="http://www.w3.org/2000/svg" version="1.1" width="1180" height="420" viewBox="0 0 1180 420" content="&lt;mxfile host=&quot;app.diagrams.net&quot; modified=&quot;2026-05-13T00:00:00.000Z&quot; agent=&quot;Codex&quot; version=&quot;24.7.17&quot;&gt;&lt;diagram id=&quot;journey-creator-flow&quot; name=&quot;Creator-Flow&quot;&gt;&lt;mxGraphModel&gt;&lt;root&gt;&lt;mxCell id=&quot;0&quot;/&gt;&lt;mxCell id=&quot;1&quot; parent=&quot;0&quot;/&gt;&lt;mxCell id=&quot;summary&quot; value=&quot;Creator-Flow: Erfassen - Formular/Bilder - Validierung - Speichern - Detailseite - Sichtbarkeit in Home/Kategorien - Gap Bearbeiten/Löschen&quot; style=&quot;text;html=1;strokeColor=none;fillColor=none;fontSize=18;fontStyle=1;fontColor=#241f33;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry x=&quot;40&quot; y=&quot;40&quot; width=&quot;1040&quot; height=&quot;40&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;/root&gt;&lt;/mxGraphModel&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
  <defs>
    <linearGradient id="vm-bg-creator" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fbf9ff"/>
      <stop offset="100%" stop-color="#f4f0ff"/>
    </linearGradient>
    <filter id="shadow-creator" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#6d4cff" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-creator" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#6d4cff"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1180" height="420" rx="28" fill="url(#vm-bg-creator)"/>
  <text x="40" y="48" fill="#241f33" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800">Creator-Flow: eigene Aktivität sichtbar machen</text>
  <text x="40" y="78" fill="#6f6a80" font-family="Inter, Arial, sans-serif" font-size="15">Persona: Jonas Frei · Ziel: eigene Aktivitätsidee erfassen, veröffentlichen und später professionell verwalten</text>

  <g font-family="Inter, Arial, sans-serif" font-size="14" fill="#241f33">
    <g filter="url(#shadow-creator)">
      <rect x="40" y="120" width="150" height="88" rx="18" fill="#ffffff" stroke="#e7ddff"/>
      <text x="62" y="150" font-weight="800">1 Erfassen</text>
      <text x="62" y="174" fill="#6f6a80">Sidebar oder</text>
      <text x="62" y="194" fill="#6f6a80">Home-CTA</text>
    </g>
    <path d="M195 164 H230" stroke="#6d4cff" stroke-width="3" fill="none" marker-end="url(#arrow-creator)"/>
    <g filter="url(#shadow-creator)">
      <rect x="240" y="120" width="170" height="88" rx="18" fill="#ffffff" stroke="#e7ddff"/>
      <text x="262" y="150" font-weight="800">2 Formular</text>
      <text x="262" y="174" fill="#6f6a80">Titel, Ort, Dauer</text>
      <text x="262" y="194" fill="#6f6a80">und Kategorien</text>
    </g>
    <path d="M415 164 H450" stroke="#6d4cff" stroke-width="3" fill="none" marker-end="url(#arrow-creator)"/>
    <g filter="url(#shadow-creator)">
      <rect x="460" y="120" width="170" height="88" rx="18" fill="#ffffff" stroke="#e7ddff"/>
      <text x="482" y="150" font-weight="800">3 Medien</text>
      <text x="482" y="174" fill="#6f6a80">Hauptbild und</text>
      <text x="482" y="194" fill="#6f6a80">Galerie prüfen</text>
    </g>
    <path d="M635 164 H670" stroke="#6d4cff" stroke-width="3" fill="none" marker-end="url(#arrow-creator)"/>
    <g filter="url(#shadow-creator)">
      <path d="M755 116 L840 164 L755 212 L670 164 Z" fill="#fff8e8" stroke="#f2c94c"/>
      <text x="714" y="158" font-weight="800">Validierung</text>
      <text x="718" y="180" fill="#6f6a80">erfüllt?</text>
    </g>
    <path d="M845 164 H880" stroke="#6d4cff" stroke-width="3" fill="none" marker-end="url(#arrow-creator)"/>
    <g filter="url(#shadow-creator)">
      <rect x="890" y="120" width="130" height="88" rx="18" fill="#ffffff" stroke="#e7ddff"/>
      <text x="912" y="150" font-weight="800">4 Speichern</text>
      <text x="912" y="174" fill="#6f6a80">MongoDB</text>
      <text x="912" y="194" fill="#6f6a80">und Redirect</text>
    </g>
    <path d="M1025 164 H1060" stroke="#6d4cff" stroke-width="3" fill="none" marker-end="url(#arrow-creator)"/>
    <g filter="url(#shadow-creator)">
      <rect x="1070" y="120" width="70" height="88" rx="18" fill="#efe7ff" stroke="#cbb7ff"/>
      <text x="1088" y="150" font-weight="800">5</text>
      <text x="1088" y="174" fill="#6f6a80">Detail</text>
      <text x="1088" y="194" fill="#6f6a80">öffnen</text>
    </g>
