<svg host="app.diagrams.net" xmlns="http://www.w3.org/2000/svg" version="1.1" width="1180" height="420" viewBox="0 0 1180 420" content="&lt;mxfile host=&quot;app.diagrams.net&quot; modified=&quot;2026-05-13T00:00:00.000Z&quot; agent=&quot;Codex&quot; version=&quot;24.7.17&quot;&gt;&lt;diagram id=&quot;journey-paar-flow&quot; name=&quot;Paar-Flow&quot;&gt;&lt;mxGraphModel&gt;&lt;root&gt;&lt;mxCell id=&quot;0&quot;/&gt;&lt;mxCell id=&quot;1&quot; parent=&quot;0&quot;/&gt;&lt;mxCell id=&quot;summary&quot; value=&quot;Paar-Flow: Login - Home - Schnellfilter/Kategorien - Detailseite - Wishlist/Planen - Upcoming - History - Bewertung&quot; style=&quot;text;html=1;strokeColor=none;fillColor=none;fontSize=18;fontStyle=1;fontColor=#241f33;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry x=&quot;40&quot; y=&quot;40&quot; width=&quot;980&quot; height=&quot;40&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;/root&gt;&lt;/mxGraphModel&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
  <defs>
