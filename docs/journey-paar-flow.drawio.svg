  <text x="40" y="48" fill="#241f33" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800">Paar-Flow: Quality Time planen</text>
  <text x="40" y="78" fill="#6f6a80" font-family="Inter, Arial, sans-serif" font-size="15">Persona: Lea Meier · Ziel: schnell eine passende Aktivität finden, speichern, planen und nach dem Erlebnis bewerten</text>

