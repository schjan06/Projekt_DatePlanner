  <rect x="0" y="0" width="1180" height="420" rx="28" fill="url(#vm-bg-date)"/>
  <text x="40" y="48" fill="#241f33" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800">First-Date-Flow: sichere Idee finden</text>
  <text x="40" y="78" fill="#6f6a80" font-family="Inter, Arial, sans-serif" font-size="15">Persona: Nico Keller · Ziel: lockere, öffentliche Aktivität mit passendem Vibe und guter Erreichbarkeit wählen</text>

  <g font-family="Inter, Arial, sans-serif" font-size="14" fill="#241f33">
