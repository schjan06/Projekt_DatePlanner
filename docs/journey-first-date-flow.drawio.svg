    <text x="408" y="310" fill="#6f6a80" font-size="14">History öffnen, Erlebnis bewerten</text>
    <text x="408" y="330" fill="#6f6a80" font-size="14">und Review ergänzen</text>
    <rect x="40" y="265" width="285" height="64" rx="16" fill="#ffffff" stroke="#d8cdf4" stroke-dasharray="8 6"/>
    <text x="62" y="293" fill="#4b2fd6" font-size="14" font-weight="800">Mögliche Frustration</text>
    <text x="62" y="315" fill="#6f6a80" font-size="14">Unsicherheit, ob Ort und Vibe passen</text>
