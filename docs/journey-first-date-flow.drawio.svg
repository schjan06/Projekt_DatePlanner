      <rect x="240" y="120" width="170" height="88" rx="18" fill="#ffffff" stroke="#d9e6ff"/>
      <text x="262" y="150" font-weight="800">2 Filtern</text>
      <text x="262" y="174" fill="#6f6a80">Ort, Preis, Dauer</text>
      <text x="262" y="194" fill="#6f6a80">und Bewertung</text>
    </g>
    <path d="M415 164 H450" stroke="#6d4cff" stroke-width="3" fill="none" marker-end="url(#arrow-date)"/>
    <g filter="url(#shadow-date)">
