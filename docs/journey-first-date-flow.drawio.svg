      <text x="912" y="174" fill="#6f6a80">Speichern</text>
      <text x="912" y="194" fill="#6f6a80">oder planen</text>
    </g>
    <path d="M1025 164 H1060" stroke="#6d4cff" stroke-width="3" fill="none" marker-end="url(#arrow-date)"/>
    <g filter="url(#shadow-date)">
