      <text x="62" y="174" fill="#6f6a80">Home oder</text>
      <text x="62" y="194" fill="#6f6a80">Map öffnen</text>
    </g>
    <path d="M195 164 H230" stroke="#6d4cff" stroke-width="3" fill="none" marker-end="url(#arrow-date)"/>
