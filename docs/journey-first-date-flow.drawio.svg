      <text x="482" y="174" fill="#6f6a80">Galerie, Reviews</text>
      <text x="482" y="194" fill="#6f6a80">und Anforderungen</text>
    </g>
    <path d="M635 164 H670" stroke="#6d4cff" stroke-width="3" fill="none" marker-end="url(#arrow-date)"/>
    <g filter="url(#shadow-date)">
      <path d="M755 116 L840 164 L755 212 L670 164 Z" fill="#fff8e8" stroke="#f2c94c"/>
      <text x="716" y="158" font-weight="800">Passt der</text>
      <text x="724" y="180" fill="#6f6a80">Vibe?</text>
    </g>
    <path d="M845 164 H880" stroke="#6d4cff" stroke-width="3" fill="none" marker-end="url(#arrow-date)"/>
    <g filter="url(#shadow-date)">
