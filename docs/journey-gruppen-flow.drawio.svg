  <text x="40" y="48" fill="#241f33" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800">Gruppen-Flow: gemeinsame Aktivität organisieren</text>
  <text x="40" y="78" fill="#6f6a80" font-family="Inter, Arial, sans-serif" font-size="15">Persona: Sara Baumann · Ziel: mehrere Interessen, Budget und Termin in einen planbaren Gruppenanlass überführen</text>

  <g font-family="Inter, Arial, sans-serif" font-size="14" fill="#241f33">
