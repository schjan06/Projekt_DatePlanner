      <text x="62" y="174" fill="#6f6a80">Kategorien</text>
      <text x="62" y="194" fill="#6f6a80">oder Wishlist</text>
    </g>
    <path d="M195 164 H230" stroke="#6d4cff" stroke-width="3" fill="none" marker-end="url(#arrow-group)"/>
